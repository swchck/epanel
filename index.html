    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Щиток",
        "alternateName": "Electrical panel map",
        "description": "QR-код на дверце щитка открывает схему автоматов и план квартиры с трассами кабелей.",
        "url": "%SITE_ROOT%",
        "image": "%SITE_ROOT%og.png",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Web, macOS, Windows, Linux",

      }
    </script>
    <link rel="icon" href="./icons/favicon.ico" sizes="48x48" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />

    <title>Щиток: схема электрощитка по QR-коду</title>
    <script>
      try {
        const t = localStorage.getItem('panel.theme') || 'auto'
        const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>

    <div id="landing"></div>
    <script type="module" src="./src/landing/main.ts"></script>
