<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="QR-код на дверце щитка открывает схему автоматов и план квартиры с трассами кабелей. Сайт работает без интернета, данные зашифрованы." />
    <meta name="theme-color" content="#16181d" />
    <meta property="og:title" content="Что отключает каждый автомат, видно по QR-коду" />
    <meta property="og:description" content="Наклейка на дверце щитка открывает схему автоматов и план квартиры с трассами кабелей." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="./icons/favicon.ico" sizes="48x48" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180x180.png" />
    <title>Щиток: схема электрощитка по QR-коду</title>
    <script>
      try {
        const t = localStorage.getItem('panel.theme') || 'auto'
        const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="landing"></div>
    <script type="module" src="./src/landing/main.ts"></script>
  </body>
</html>
