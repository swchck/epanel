[package]
name = "panel-editor"
version = "1.0.0"
description = "Desktop editor for an apartment electrical panel map"
authors = []
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "panel_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
