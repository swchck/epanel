<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Интерактивная карта электрощитка: автоматы, план квартиры, что делать, если выбило." />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f6f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0f12" />
    <link rel="icon" href="../icons/favicon.ico" sizes="48x48" />
    <link rel="icon" href="../icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon-180x180.png" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <meta name="application-name" content="Щиток" />
    <meta name="apple-mobile-web-app-title" content="Щиток" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- a shared panel link previews only the generic card: the panel itself is encrypted and stays that way -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Щиток" />
    <meta property="og:title" content="Схема электрощитка" />
    <meta property="og:description" content="Что отключает каждый автомат, план квартиры и что делать, если выбило." />
    <meta property="og:image" content="%SITE_ROOT%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_ROOT%og.png" />
    <title>Щиток</title>
    <script>
      // apply the theme before first paint so dark-mode users don't get a white flash
      try {
        const t = localStorage.getItem('panel.theme') || 'auto'
        const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="app">
      <!-- painted before any JS runs, then Vue mounts over it -->
      <div class="grid min-h-dvh place-items-center bg-background">
        <svg viewBox="0 0 64 64" aria-hidden="true" class="size-14 animate-pulse">
          <rect x="4" y="4" width="56" height="56" rx="14" fill="var(--primary)" />
          <rect x="14" y="16" width="36" height="32" rx="4" fill="var(--primary-foreground)" opacity="0.92" />
          <rect x="18" y="20" width="6" height="24" rx="1.5" fill="var(--primary)" />
          <rect x="26" y="20" width="6" height="24" rx="1.5" fill="var(--primary)" />
          <rect x="34" y="20" width="12" height="24" rx="1.5" fill="var(--primary)" />
          <path d="M41 24 L37 33 H41 L38.5 40 L44 30 H40 L42.5 24 Z" fill="var(--primary-foreground)" />
        </svg>
      </div>
    </div>
    <script type="module" src="../src/main.ts"></script>
  </body>
</html>
