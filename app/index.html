<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Интерактивная карта электрощитка: автоматы, план квартиры, что делать, если выбило." />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#16181d" />
    <link rel="icon" href="../icons/favicon.ico" sizes="48x48" />
    <link rel="icon" href="../icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon-180x180.png" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <title>Щиток</title>
    <script>
      // apply the theme before first paint so dark-mode users don't get a white flash
      try {
        const t = localStorage.getItem('panel.theme') || 'auto'
        const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="app">
      <!-- painted before any JS runs, then Vue mounts over it -->
      <div class="grid min-h-dvh place-items-center bg-background">
        <svg viewBox="0 0 64 64" aria-hidden="true" class="size-14 animate-pulse">
          <rect x="4" y="4" width="56" height="56" rx="14" fill="var(--primary)" />
          <rect x="14" y="16" width="36" height="32" rx="4" fill="var(--primary-foreground)" opacity="0.92" />
          <rect x="18" y="20" width="6" height="24" rx="1.5" fill="var(--primary)" />
          <rect x="26" y="20" width="6" height="24" rx="1.5" fill="var(--primary)" />
          <rect x="34" y="20" width="12" height="24" rx="1.5" fill="var(--primary)" />
          <path d="M41 24 L37 33 H41 L38.5 40 L44 30 H40 L42.5 24 Z" fill="var(--primary-foreground)" />
        </svg>
      </div>
    </div>
    <script type="module" src="../src/main.ts"></script>
  </body>
</html>
